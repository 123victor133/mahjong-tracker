<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#10251f"><title>麻將記牌器</title><style>*{box-sizing:border-box}body{margin:0;background:#10251f;color:#f3f6ee;font-family:system-ui,'Noto Sans TC',sans-serif}.wrap{max-width:560px;margin:auto;padding:22px 14px 40px}h1{text-align:center;font-size:26px;margin:8px 0 6px}.hint{text-align:center;color:#afc3b9;font-size:13px;margin:0 0 22px}.section{margin:20px 0}.head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px;font-size:19px;font-weight:700}.count{font-size:13px;color:#b4c8bf;font-weight:400}.tiles{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px}.tile{position:relative;aspect-ratio:0.72;background:#fffdf3;color:#17261f;border:0;border-radius:6px;box-shadow:0 4px 0 #b4b5a7;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:2px;touch-action:manipulation;transition:background .12s,opacity .12s}.tile .num{font-size:clamp(17px,5.5vw,29px);font-weight:800;line-height:1.2}.tile .suit{font-size:clamp(12px,3.6vw,19px);font-weight:800}.tile.wan .suit{color:#c12e35}.tile.tong .suit{color:#1e668f}.tile.tiao .suit{color:#228450}.tile.off{background:#67716b;opacity:.56;box-shadow:0 2px 0 #414c46}.tile.off .num,.tile.off .suit{color:#d1d7d1}.tile.off:after{content:'✕';position:absolute;inset:0;display:grid;place-items:center;color:#e5eee8;font-size:clamp(27px,9vw,48px);font-weight:300;text-shadow:0 1px 3px #303b35}.actions{display:flex;gap:10px;margin-top:27px}.reset{width:100%;padding:15px;background:#df6b59;color:white;border:0;border-radius:12px;font-size:17px;font-weight:750;cursor:pointer}.foot{text-align:center;color:#91a79c;font-size:12px;margin-top:16px}@media(min-width:500px){.tiles{gap:9px}.tile{border-radius:9px}}</style></head><body><main class="wrap"><h1>🀄 麻將記牌器</h1><p class="hint">點一下標記，再點一下取消｜自動保存</p><div id="board"></div><div class="actions"><button class="reset" id="reset">全部重置</button></div><p class="foot">所有資料只保存在這台裝置的瀏覽器</p></main><script>const key='mahjong-27-tracker-v1';let marked;try{marked=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch{marked={}}const suits=[['萬','wan'],['筒','tong'],['條','tiao']];const board=document.getElementById('board');function render(){board.innerHTML='';for(const [name,cls] of suits){const section=document.createElement('section');section.className='section';const n=Array.from({length:9},(_,i)=>`${cls}-${i+1}`).filter(k=>marked[k]).length;section.innerHTML=`<div class="head"><span>${name}子</span><span class="count">已標記 ${n} / 9</span></div>`;const tiles=document.createElement('div');tiles.className='tiles';for(let i=1;i<=9;i++){const id=`${cls}-${i}`;const b=document.createElement('button');b.type='button';b.className=`tile ${cls}${marked[id]?' off':''}`;b.setAttribute('aria-label',`${i}${name}，${marked[id]?'已標記':'未標記'}`);b.setAttribute('aria-pressed',!!marked[id]);b.innerHTML=`<span class="num">${i}</span><span class="suit">${name}</span>`;b.addEventListener('click',()=>{marked[id]=!marked[id];save();render()});tiles.appendChild(b)}section.appendChild(tiles);board.appendChild(section)}}function save(){try{localStorage.setItem(key,JSON.stringify(marked))}catch{}}document.getElementById('reset').addEventListener('click',()=>{if(confirm('確定要清除全部 27 張牌的標記嗎？')){marked={};save();render()}});render();</script></body></html>
